name: waiting_room_app
description: "Workshop 6 - Building a Resilient Single-Room Waiting Queue with Flutter and Supabase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  provider: ^6.1.2
  geolocator: ^14.1.2
  connectivity_plus: ^6.1.4
  sqflite: ^2.4.5
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - .env
